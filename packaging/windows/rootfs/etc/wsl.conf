# FiberBrowser's own WSL distribution (imported by FiberBrowser-Setup.exe as
# "FiberBrowser"; it never changes your other distributions).
[user]
default = fiberbrowser

[boot]
systemd = false

[interop]
# Windows programs (powershell.exe for the open dialogs, explorer.exe for
# "Show in Explorer") must run from inside the distribution.
enabled = true
appendWindowsPath = true

[automount]
enabled = true
root = /mnt/
