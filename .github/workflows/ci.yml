name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly: also runs the browser end-to-end job below.
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  backend:
    name: backend (Python ${{ matrix.python }}, FastAPI ${{ matrix.fastapi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        # The range requirements.txt allows; 0.142 changed how routers are stored.
        fastapi: ["0.124.4", "0.142.0"]
    env:
      FIBERHMM_NO_UPDATE_CHECK: "1"
      FIBERBROWSER_NO_OPEN: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System libraries and tools
        # libcurl: pyBigWig's remote tracks (built from source below); minimap2: the
        # region-sync sequence blocks (the apps bundle it).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev minimap2
      - name: Install FiberHMM
        # The published FiberHMM 3 release from PyPI, as requirements.txt pins it.
        run: |
          python -m pip install --upgrade pip
          pip install "fiberhmm[consensus]>=3.0,<4"
      - name: Install FiberBrowser and test tools
        run: |
          grep -v -i '^fiberhmm' requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
          pip install -r "$RUNNER_TEMP/requirements-ci.txt" -r requirements-dev.txt "fastapi==${{ matrix.fastapi }}"
      - name: Build pyBigWig with libcurl
        # PyPI's x86_64 Linux wheel has no libcurl (pyBigWig.remote == 0) and can't read
        # http(s)/s3/ssh tracks; the WSL distro builds it from source the same way.
        run: |
          pip install --force-reinstall --no-deps --no-cache-dir --no-binary pyBigWig pyBigWig
          python -c "import pyBigWig; assert pyBigWig.remote and pyBigWig.numpy, (pyBigWig.remote, pyBigWig.numpy)"
      - name: pytest
        run: python -m pytest tests -m "not integration" -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser/frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Committed dist matches the source
        run: |
          npx vite build --outDir /tmp/dist --emptyOutDir
          diff -r /tmp/dist dist

  e2e:
    # Optional: nightly and on demand (Actions > CI > Run workflow), not on every push.
    # A real FiberBrowser server on the tracked demo BAM driven by Chromium
    # (npm run test:e2e:release, ~5 min), plus the gated headless-render tests.
    name: browser end-to-end (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIBERHMM_NO_UPDATE_CHECK: "1"
      FIBERBROWSER_NO_OPEN: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FiberHMM
        # The published FiberHMM 3 release from PyPI.
        run: |
          python -m pip install --upgrade pip
          pip install "fiberhmm[consensus]>=3.0,<4"
      - name: Install FiberBrowser and test tools
        run: |
          grep -v -i '^fiberhmm' requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
          pip install -r "$RUNNER_TEMP/requirements-ci.txt" -r requirements-dev.txt
      - name: Build pyBigWig with libcurl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
          pip install --force-reinstall --no-deps --no-cache-dir --no-binary pyBigWig pyBigWig
          python -c "import pyBigWig; assert pyBigWig.remote and pyBigWig.numpy, (pyBigWig.remote, pyBigWig.numpy)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser/frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: browser/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Release end-to-end specs
        working-directory: browser/frontend
        run: npm run test:e2e:release
      - name: Gated headless-render tests
        env:
          FIBERBROWSER_RUN_PLAYWRIGHT_RENDER: "1"
        run: python -m pytest tests/test_playwright_render.py tests/test_figure_render.py -q -p no:cacheprovider
      - name: Keep Playwright reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: browser/frontend/test-results
          retention-days: 7
