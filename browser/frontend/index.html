<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>FiberBrowser</title>
    <!-- Icons and the web app manifest live under /assets/, which the access
         token doesn't guard (the browser fetches the manifest without cookies).
         Sources: packaging/icons (build_icons.py). -->
    <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/assets/icons/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/manifest.webmanifest" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="application-name" content="FiberBrowser" />
  </head>
  <body>
    <script>
      // Apply dark mode before React mounts to prevent flash
      if (localStorage.getItem('fiberhmm_darkmode') === 'true') {
        document.documentElement.classList.add('dark');
        document.querySelector('meta[name="color-scheme"]').content = 'dark';
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
