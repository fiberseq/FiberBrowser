[pytest]
pythonpath = tests browser
markers =
    integration: tests on the lab's Drosophila BAM/BigBed data; set FIBERBROWSER_TEST_DATA_DIR to a dir with the fly_lab_data layout, otherwise they skip (deselect with -m "not integration")
    slow: tests that start subprocesses (headless server)
    real_hardware: the test sees this machine's real cores/RAM (others see at least a Standard machine; tests/conftest.py)
